<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Internet</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css">

    <style>
        :root {

            --primary: #F59E0B;
            --primary-dark: #D97706;
            --secondary: #F97316;
            --accent: #FDBA74;

            --bg-light: #101827;
            --bg-card: rgba(24, 34, 52, .82);

            --text-main: #F8FAFC;
            --text-muted: #94A3B8;

            --border: rgba(245, 158, 11, .12);
            --border-dark: rgba(245, 158, 11, .28);

            --glass-bg: rgba(2, 6, 23, .82);
            --glass-border: rgba(255, 255, 255, .06);

            --shadow-lg: 0 20px 48px rgba(0, 0, 0, .28);

            --transition: .35s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-main);
            background: var(--bg-light);
        }

        /* Animated Background */

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .18;
            animation: float 8s ease-in-out infinite;
        }

        body::before {
            background: var(--primary);
            top: -120px;
            left: -120px;
        }

        body::after {
            background: #ff6a00;
            bottom: -180px;
            right: -150px;
            animation-delay: 3s;
        }

        @keyframes float {

            50% {
                transform: translateY(40px) translateX(20px);
            }

        }

        .card {

            width: min(92%, 520px);

            background: var(--glass-bg);
            backdrop-filter: blur(22px);

            border: 1px solid var(--glass-border);

            border-radius: 24px;

            padding: 45px;

            text-align: center;

            box-shadow: var(--shadow-lg);

            position: relative;

            z-index: 5;

        }

        .wifi {

            width: 110px;
            height: 110px;

            margin: auto auto 25px;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            background: rgba(245, 158, 11, .08);

            border: 1px solid var(--border-dark);

            animation: pulse 2s infinite;

        }

        @keyframes pulse {

            50% {

                transform: scale(1.08);

            }

        }

        .wifi i {

            font-size: 55px;

            color: var(--primary);

        }

        h1 {

            font-size: 34px;

            margin-bottom: 15px;

        }

        p {

            color: var(--text-muted);

            line-height: 1.8;

            margin-bottom: 35px;

        }

        button {

            border: none;

            background: linear-gradient(135deg,
                    var(--primary),
                    var(--secondary));

            color: white;

            padding: 15px 35px;

            border-radius: 50px;

            font-size: 16px;

            cursor: pointer;

            transition: var(--transition);

            display: inline-flex;

            align-items: center;

            gap: 10px;

        }

        button:hover {

            transform: translateY(-5px);

            box-shadow: 0 12px 25px rgba(245, 158, 11, .35);

        }

        button i {

            font-size: 20px;

        }

        .status {

            margin-top: 25px;

            color: var(--primary);

            font-size: 15px;

        }

        .loader {

            width: 24px;
            height: 24px;

            border: 3px solid rgba(255, 255, 255, .2);

            border-top-color: white;

            border-radius: 50%;

            display: none;

            margin-left: 10px;

            animation: spin .8s linear infinite;

        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        @media(max-width:600px) {

            .card {

                padding: 35px 25px;

            }

            h1 {

                font-size: 28px;

            }

        }
    </style>

</head>

<body>

    <div class="card">

        <div class="wifi">
            <i class="ri-wifi-off-line"></i>
        </div>

        <h1>No Internet Connection</h1>

        <p>
            Looks like you're offline. Please check your internet connection and
            try again. We'll automatically reconnect once you're back online.
        </p>

        <button id="reload">

            <i class="ri-refresh-line"></i>

            Reload

            <span class="loader" id="loader"></span>

        </button>

        <div class="status" id="status">
            Waiting for connection...
        </div>

    </div>

    <script>

        const reloadBtn = document.getElementById("reload");
        const loader = document.getElementById("loader");
        const status = document.getElementById("status");

        reloadBtn.onclick = () => {

            loader.style.display = "inline-block";

            status.innerHTML = "Checking connection...";

            setTimeout(() => {

                location.reload();

            }, 700);

        };

        window.addEventListener("online", () => {

            status.innerHTML = "Connection Restored ✓";

            setTimeout(() => {

                location.href = "/";

            }, 800);

        });

    </script>

</body>

</html>
